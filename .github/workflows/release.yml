name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check tag matches package
        run: node -e 'if(process.env.GITHUB_REF_NAME!=="v"+JSON.parse(require("fs").readFileSync("package.json")).version)process.exit(1)'
      - run: npm test
      - run: npm run build:portable
      - run: npm run build:worker
      - run: node scripts/verify-worker.mjs
      - name: Package portable application
        working-directory: outputs/portable
        run: |
          zip "../WraeclastForge-${GITHUB_REF_NAME}.zip" "WraeclastForge-${GITHUB_REF_NAME}.html" README.txt LICENSE THIRD_PARTY_NOTICES.md
          cd ..
          sha256sum "WraeclastForge-${GITHUB_REF_NAME}.zip" >> SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "outputs/WraeclastForge-${GITHUB_REF_NAME}.zip"
          outputs/SHA256SUMS.txt
          --verify-tag
          --title "${GITHUB_REF_NAME} — Синхронизация курсов валют"
          --notes-file RELEASE_NOTES.md
          --latest
